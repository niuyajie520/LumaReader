<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Luma · 阅读助手</title><link rel="stylesheet" href="AIChat.css"></head><body>
<svg class="symbols" aria-hidden="true"><defs>
<symbol id="sparkles" viewBox="0 0 24 24"><path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6ZM20 2v4m-2-2h4"/></symbol>
<symbol id="fold" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16m-5-11 3 3-3 3"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 4 2 2v4l4 3 3-1 3 1 4-3v-4l2-2-2-4-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="history-icon" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 3 8M3 5v6h6m3-5v6l4 2"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M12 6C8 3 4 4 3 5v15c3-2 6-2 9 0 3-2 6-2 9 0V5c-3-2-6-2-9 1Zm0 0v14"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
</defs></svg>
<header><button id="collapse" class="icon" aria-label="折叠 AI 助手" title="折叠 AI 助手"><svg><use href="#fold"/></svg></button><div class="identity" aria-label="阅读助手"><svg class="brand"><use href="#sparkles"/></svg><span>Luma<span class="sub">阅读助手</span></span></div><div class="actions"><button id="pin" class="icon" aria-label="固定 AI 面板" title="固定 AI 面板" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m8 3 8 0-1 6 3 4v2H6v-2l3-4Zm4 12v7"/></svg></button><button id="expand" class="icon" aria-label="放大或还原" title="放大或还原"><svg viewBox="0 0 24 24"><path d="M9 3H3v6m0-6 7 7m5 11h6v-6m0 6-7-7"/></svg></button><button id="history" class="icon" aria-label="聊天记录" title="聊天记录" aria-expanded="false" aria-controls="history-panel"><svg><use href="#history-icon"/></svg></button><button id="settings" class="icon" aria-label="设置 API" title="设置 API"><svg><use href="#gear"/></svg></button></div></header>
<section id="history-panel" class="history-panel" aria-label="聊天记录" hidden><div class="history-heading"><strong>聊天记录</strong><button id="new" class="quiet" aria-label="新建对话">新建对话</button></div><div id="history-list"></div><p id="history-empty">暂无聊天记录</p></section>
<div class="provider-row"><label class="provider-label">服务商<select id="provider" aria-label="AI 服务商"></select></label><span id="model"></span></div>
<details id="reading"><summary><svg><use href="#book"/></svg><span id="book-title"></span><span class="chevron">⌄</span></summary><div class="reading-body"><span id="chapter"></span><blockquote id="quote"></blockquote><button id="remove" class="quiet">移除引用</button></div></details>
<div id="image-attachment" hidden><span id="image-name"></span><button id="remove-image" aria-label="移除图片" title="移除图片">×</button></div>
<main id="messages" aria-label="聊天记录" aria-live="polite"><div id="empty"><svg><use href="#sparkles"/></svg><h1>读到这里，想到了什么？</h1><p>解释选文，也可以聊聊你的想法。</p><button id="explain" class="suggestion">解释这段话</button><button id="example" class="suggestion">给我一个生活中的例子</button></div></main>
<div id="error" role="alert" hidden></div>
<footer><div class="composer"><div id="selection-reference" hidden><details id="selection-detail"><summary aria-label="展开引用选文"><svg><use href="#book"/></svg><span id="selection-preview"></span><span class="chevron">⌄</span></summary><blockquote id="selection-full"></blockquote></details><button id="clear-selection" aria-label="移除选文" title="移除选文">×</button></div><textarea id="draft" aria-label="给 AI 的问题" placeholder="发送消息" rows="1" maxlength="12000"></textarea><div class="composer-bottom"><button id="send" class="send" aria-label="发送" title="发送 · ⌘ Enter"><svg><use href="#arrow"/></svg></button></div></div><label class="context-toggle"><input id="include" type="checkbox" checked>附带当前阅读</label><div class="footnote">仅发送你选择的上下文<span>⌘ Enter 发送</span></div></footer>
<script src="AppStrings.js"></script><script src="AIChat.js"></script></body></html>
