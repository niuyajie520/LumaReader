name: LumaReader macOS 26 ARM64 CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos:
    name: Swift tests + release app (macOS 26 ARM64)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect macOS and Xcode environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version
          xcrun swift --version

      - name: Validate requested deployment target
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '\.macOS\(\.v26\)' Package.swift || {
            echo 'ERROR: Package.swift must target macOS 26+: .macOS(.v26)' >&2
            exit 1
          }
          grep -q '<key>LSMinimumSystemVersion</key><string>26.0</string>' Scripts/build-macos.sh || {
            echo 'ERROR: app Info.plist must specify LSMinimumSystemVersion 26.0' >&2
            exit 1
          }

      - name: Test Swift package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          xcrun swift test 2>&1 | tee ci-logs/swift-test.log

      - name: Build release app
        shell: bash
        env:
          LUMA_NO_OPEN: '1'
        run: |
          set -o pipefail
          mkdir -p ci-logs
          bash Scripts/build-macos.sh 2>&1 | tee ci-logs/release-build.log

      - name: Package app artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict 'dist/Luma Reader.app'
          ditto -c -k --sequesterRsrc --keepParent 'dist/Luma Reader.app' 'dist/LumaReader-macOS26-arm64.zip'

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LumaReader-macOS26-CI-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LumaReader-macOS26-arm64
          path: dist/LumaReader-macOS26-arm64.zip
          if-no-files-found: error
          retention-days: 14
