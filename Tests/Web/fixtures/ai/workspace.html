<!doctype html><html lang="zh"><meta charset="utf-8"><title>Luma · 阅读与 AI 分栏验证</title><style>
*{box-sizing:border-box}body{margin:0;background:#e6e8e2;color:#2d342d;font:14px -apple-system,"Noto Sans CJK SC",sans-serif}.label{padding:18px 28px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#6f766d}.label strong{font-size:18px;color:#323a31}.shell{margin:0 25px 18px;border:1px solid #cbd2c5;border-radius:17px;overflow:hidden;background:#f3f7f0;box-shadow:0 14px 50px #283b2420}.bar{height:50px;display:flex;justify-content:center;align-items:center;border-bottom:1px solid #dce2d6;background:#f3f7f0;color:#717a6b;font-size:12px}.workspace{height:700px;display:flex;position:relative}#book{width:0;flex:1;border:0;min-width:0}#ai{width:380px;flex-shrink:0;border:0;border-left:1px solid #d9dfd4}#divider{width:5px;margin-left:-3px;background:transparent;cursor:col-resize;z-index:1;touch-action:none}#divider:hover{background:#6e927744}#reopen{position:absolute;right:10px;top:44%;width:34px;height:49px;border:1px solid #d6dfd0;background:#e6ede2;border-radius:11px;color:#6e9277;font-size:22px;cursor:pointer}[hidden]{display:none!important}.note{text-align:center;font-size:11px;color:#7b8275;padding:0 10px 12px}</style>
<div class="label"><strong>Luma / 阅读与 AI</strong><span>浏览器分栏布局验证 · 模拟回复 · 非 Mac 实机截图</span></div><div class="shell"><div class="bar">逻辑与思考 · 第一章</div><div class="workspace"><iframe id="book" title="左侧阅读" src="/reader.html"></iframe><div id="divider" role="separator" aria-label="调整 AI 栏宽度" aria-orientation="vertical" tabindex="0"></div><iframe id="ai" title="右侧 AI" src="/app/AIChat.html"></iframe><button id="reopen" aria-label="展开 AI 助手" title="展开 AI 助手" hidden>✧</button></div></div><div class="note">阅读引擎与 AI 使用包内实际资源；外层分栏用于浏览器验证，Mac 端使用保留网页实例的原生布局。</div><script src="fixture.js"></script><script>
let aiState;const panel=document.getElementById('ai'),divider=document.getElementById('divider'),reopen=document.getElementById('reopen');
function fold(value){panel.hidden=value;divider.hidden=value;reopen.hidden=!value}
panel.onload=()=>{const w=panel.contentWindow;aiState=attachFixture(w,'mint');const bridge=w.webkit.messageHandlers.lumaAI;const original=bridge.postMessage.bind(bridge);bridge.postMessage=m=>{original(m);if(m.action==='collapse'){original({action:'stop'});fold(true)}};aiState.context={title:'逻辑与思考',chapter:'第一章 · 概念与判断'};aiState.pendingQuote='概念帮助我们认识事物，判断则表达事物之间的关系。';w.LumaAI.receive(structuredClone(aiState))};
reopen.onclick=()=>fold(false);
divider.onpointerdown=e=>{divider.setPointerCapture(e.pointerId);divider.onpointermove=e=>{if(e.buttons)panel.style.width=Math.max(340,Math.min(480,document.querySelector('.workspace').getBoundingClientRect().right-e.clientX))+'px'};divider.onpointerup=()=>divider.onpointermove=null};divider.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();panel.style.width=Math.max(340,Math.min(480,panel.getBoundingClientRect().width+(e.key==='ArrowLeft'?20:-20)))+'px'}};
</script></html>
