name: Study real speech inference and playback
on:
  pull_request:
    paths:
      - 'Deferred/StudyCenter/**'
      - 'Scripts/StudySpeech/**'
      - '.github/workflows/study-speech-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: speech-benchmark-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  real-speech:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [vits-piper-en_US-lessac-medium, vits-piper-en_GB-cori-medium]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned inference runtime
        run: python -m pip install sherpa-onnx==1.12.34 numpy==2.2.6
      - name: Fetch model into isolated runner storage
        env:
          MODEL_ID: ${{ matrix.model }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/study-model" speech-evidence
          curl --fail --location --retry 2 --max-time 240 --max-filesize 200000000 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$MODEL_ID.tar.bz2" -o "$RUNNER_TEMP/study-model/model.tar.bz2"
          python - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'study-model'
          archive=folder/'model.tar.bz2'
          with tarfile.open(archive) as t:
              t.extractall(folder,filter='data')
          Path('speech-evidence/model-origin.json').write_text(json.dumps({'source':'k2-fsa/sherpa-onnx tts-models release','model':os.environ['MODEL_ID'],'archiveSHA256':hashlib.sha256(archive.read_bytes()).hexdigest(),'redistributed':False},indent=2))
          PY
      - name: Benchmark actual cold and warm model inference
        env:
          MODEL_ID: ${{ matrix.model }}
        run: python Scripts/StudySpeech/benchmark.py --model-dir "$RUNNER_TEMP/study-model/$MODEL_ID" --output speech-evidence/inference.json
      - name: Verify production cache and native audio submission with actual speech
        env:
          MODEL_ID: ${{ matrix.model }}
        shell: bash
        run: |
          set -euo pipefail
          python Scripts/StudySpeech/sherpa_service.py --model-dir "$RUNNER_TEMP/study-model/$MODEL_ID" --model-id "$MODEL_ID" --port 8765 > "$RUNNER_TEMP/study-speech-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for i in range(120):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/v1/models',timeout=1).read()
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise RuntimeError('Resident model worker did not become ready')
          PY
          if ! LUMA_REAL_SPEECH_URL=http://127.0.0.1:8765/v1 LUMA_REAL_SPEECH_MODEL="$MODEL_ID" swift test --package-path Deferred/StudyCenter --filter SpeechPipelinePlaybackTests > "$RUNNER_TEMP/study-real-playback.log" 2>&1; then
            python - <<'DIAGNOSTIC'
          import os,re
          from pathlib import Path
          text=(Path(os.environ['RUNNER_TEMP'])/'study-real-playback.log').read_text()
          for line in text.splitlines():
              if any(marker in line for marker in ['error:', 'recorded an issue', 'Expectation failed', 'SpeechPlaybackProbe', 'Test run', 'failed after']):
                  print(re.sub(r'/Users/[^\s:]+','[runner-path]',line))
          DIAGNOSTIC
            exit 1
          fi
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          log=(Path(os.environ['RUNNER_TEMP'])/'study-real-playback.log').read_text()
          match=re.search(r'SpeechPlaybackProbe cacheHit=true playerSubmissionMS=([0-9.]+) realModel=true',log)
          assert match,'Missing actual production cache/player evidence'
          assert '1 test' in log and 'passed' in log,'Missing test completion'
          Path('speech-evidence/playback.json').write_text(json.dumps({'method':'production Swift cache and AVAudioPlayer; real generated WAV','cacheHit':True,'playerPrepareAndSubmitMS':float(match[1]),'physicalSoundLatency':'NOT MEASURED','within300MSTarget':float(match[1])<300},indent=2))
          PY
      - name: Upload numeric model measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: study-speech-${{ matrix.model }}
          path: speech-evidence/*.json
          if-no-files-found: error
          retention-days: 7
