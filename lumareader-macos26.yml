name: LumaReader macOS 26 CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-native:
    name: Native build and tests
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          {
            sw_vers
            uname -m
            xcode-select -p
            xcodebuild -version
            xcrun swift --version
          } 2>&1 | tee ci-logs/environment.log

      - name: Check complete source and deployment target
        shell: bash
        run: |
          set -euo pipefail
          for path in Package.swift Sources Tests Scripts/build-macos.sh; do
            if [ ! -e "$path" ]; then
              echo "::error::Missing $path. Upload the unpacked LumaReader source folder, not only README or CI YAML."
              exit 1
            fi
          done
          if ! grep -Eq '\.macOS\(\.v26\)' Package.swift; then
            echo '::error::Set Package.swift platforms to macOS 26: .macOS(.v26)'
            exit 1
          fi

      - name: Test Swift package
        shell: bash
        run: |
          set -o pipefail
          xcrun swift test 2>&1 | tee ci-logs/swift-test.log

      - name: Build native app
        shell: bash
        env:
          LUMA_NO_OPEN: '1'
        run: |
          set -o pipefail
          bash Scripts/build-macos.sh 2>&1 | tee ci-logs/release-build.log

      - name: Package built application
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -d 'dist/Luma Reader.app'
          codesign --verify --deep 'dist/Luma Reader.app'
          ditto -c -k --sequesterRsrc --keepParent 'dist/Luma Reader.app' 'dist/LumaReader-macOS26.zip'

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS26-logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LumaReader-macOS26
          path: dist/LumaReader-macOS26.zip
          if-no-files-found: error
          retention-days: 14
